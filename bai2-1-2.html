
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Border Style</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        h2 {
            text-align: center;
        }

        .container {
            width: 600px;
            border: 1px solid gray;
            padding: 20px;
        }

        .sample {
            margin: 12px 0;
            padding: 8px;
            border-width: 3px;
            border-color: black;
        }

        .dotted {
            border-style: dotted;
        }

        .dashed {
            border-style: dashed;
        }

        .solid {
            border-style: solid;
        }

        .double {
            border-style: double;
        }

        .groove {
            border-style: groove;
        }

        .ridge {
            border-style: ridge;
        }

        .inset {
            border-style: inset;
        }

        .outset {
            border-style: outset;
        }

        .none {
            border-style: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>The border-style Property</h2>

        <p>This property specifies what kind of border to display:</p>

        <div class="sample dotted">A dotted border.</div>

        <div class="sample dashed">A dashed border.</div>

        <div class="sample solid">A solid border.</div>

        <div class="sample double">A double border.</div>

        <div class="sample groove">A groove border.</div>

        <div class="sample ridge">A ridge border.</div>

        <div class="sample inset">An inset border.</div>

        <div class="sample outset">An outset border.</div>

        <div class="sample none">No border.</div>

    </div>

</body>
</html>
